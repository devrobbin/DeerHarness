<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="DeerHarness">
  <defs>
    <linearGradient id="dh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dh-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe3f0"/>
    </linearGradient>
  </defs>

  <!-- 徽章底：品牌渐变圆 -->
  <circle cx="128" cy="128" r="120" fill="url(#dh-bg)"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Harness 轨道（约束系统）：虚线圆环 -->
  <circle cx="128" cy="134" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"
          stroke-dasharray="1 9" stroke-linecap="round"/>

  <!-- 鹿角（DeerFlow 元素，融合成头饰） -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <!-- 左主梁 -->
    <path d="M112,94 C102,70 88,58 66,54"/>
    <!-- 左分叉 -->
    <path d="M94,66 C86,52 78,44 66,36"/>
    <path d="M106,80 C96,68 88,60 76,52"/>
    <!-- 右主梁 -->
    <path d="M144,94 C154,70 168,58 190,54"/>
    <!-- 右分叉 -->
    <path d="M162,66 C170,52 178,44 190,36"/>
    <path d="M150,80 C160,68 168,60 180,52"/>
  </g>

  <!-- 企鹅身体（PenguinHarness 元素，融合本体） -->
  <path d="M128,100 C152,100 166,126 166,154 C166,186 152,204 128,204
           C104,204 90,186 90,154 C90,126 104,100 128,100 Z" fill="url(#dh-body)"/>
  <!-- 白肚皮 -->
  <path d="M128,130 C139,130 145,150 145,167 C145,185 139,195 128,195
           C117,195 111,185 111,167 C111,150 117,130 128,130 Z" fill="#ffffff"/>
  <!-- 翅膀 -->
  <path d="M152,152 C166,156 173,170 169,186 C161,183 153,174 148,160 Z" fill="#c3cede"/>
  <!-- 喙（橙色点睛） -->
  <path d="M163,138 L188,146 L163,156 Z" fill="#f59e0b"/>
  <!-- 眼睛 -->
  <circle cx="141" cy="128" r="5" fill="#1e293b"/>
</svg>
