# DeerHarness 自有服务编排（Gateway + WebUI）。
#
# ⚠️ 真实上游集成说明（千问初版假设已修正）：
#   - DeerFlow 官方栈（redis/nginx/frontend/gateway/provisioner）用其自带编排启动：
#       cd ../deer-flow && cp .env.example .env  # 填入 BETTER_AUTH_SECRET 等
#       docker compose -f docker/docker-compose.yaml up -d
#     （nginx 前门 :2026，内部 gateway:8001；provisioner 为可选 K8s 组件）
#   - PenguinHarness（Node/pnpm 项目，非 Python）用开发模式启动：
#       cd ../penguin-harness && pnpm install && pnpm dev:server   # :7368
#   - 上游没有可直接 `docker build` 的顶层 Dockerfile，因此不在此编排。

services:
  # ==================== DeerHarness Gateway ====================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PENGUIN_API=http://host.docker.internal:7368
      - PENGUIN_USER_ID=admin
      - PENGUIN_PASSWORD=${PENGUIN_PASSWORD:-penguin-3983}
      - DEERFLOW_API=http://host.docker.internal:2026
    volumes:
      - gateway_config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==================== DeerHarness WebUI ====================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      - gateway

volumes:
  gateway_config:

networks:
  default:
    driver: bridge
