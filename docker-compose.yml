version: "3.9"

services:
  # ==================== DeerFlow ====================
  deerflow:
    build:
      context: ../deer-flow
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
      - "2024:2024"
      - "2026:2026"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - deerflow_data:/app/data
    networks:
      - deerharness

  # ==================== PenguinHarness ====================
  penguin:
    build:
      context: ../penguin-harness
      dockerfile: Dockerfile
    ports:
      - "7364:7364"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - penguin_data:/app/data
    networks:
      - deerharness

  # ==================== DeerHarness Gateway ====================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEERFLOW_API=http://deerflow:8001
      - PENGUIN_API=http://penguin:7364
    depends_on:
      - deerflow
      - penguin
    volumes:
      - gateway_config:/app/config
    networks:
      - deerharness

  # ==================== DeerHarness WebUI ====================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      - gateway
    networks:
      - deerharness

volumes:
  deerflow_data:
  penguin_data:
  gateway_config:

networks:
  deerharness:
    driver: bridge
